  application:
    name: ultra-trading-order
  datasource:
    url: jdbc:mysql://sshproxy.zszhizhu.cn:33247/omsdata?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: tds
    password: Tds!0502
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  redis:
    redisson:
      config:
        singleServerConfig:
          address: "redis://116.63.80.121:5500"
          password: "timi123#123"
          database: 0
          connectionPoolSize: 64
          connectionMinimumIdleSize: 10
          timeout: 10000
          connectTimeout: 10000
          retryAttempts: 3
          retryInterval: 1500
          pingConnectionInterval: 30000
          keepAlive: true
        threads: 16
        nettyThreads: 32

# Gateway TCP Server Configuration (we are the TCP server, gateway connects to us)
gateway:
  tcp:
    port: 5502  # Our TCP server port
    client:
      enabled: false
    host: 127.0.0.1
    reconnect-interval: 5000
    connect-timeout: 3000

# ZeroMQ Configuration
zeromq:
  ems:
    endpoint: "tcp://127.0.0.1:5555"  # Send order events to EMS
  trade:
    port: 5556  # Receive trade notifications from EMS

# Exchange API Configuration
exchange:
  binance:
    api-url: "https://api.binance.com"
  okx:
    api-url: "https://www.okx.com"

# Symbol Sync Configuration
symbol:
  sync:
    enabled: true
    initial-delay: 0
    fixed-rate: 300000  # 5 minutes

# Redis Keys Configuration
redis:
  keys:
    symbol-prefix: "trading:symbol:"
    order-prefix: "trading:order:"
    trade-prefix: "trading:trade:"
    asset-prefix: "trading:asset:"
    balance-prefix: "trading:balance:"
    flow-prefix: "trading:flow:"
